name: Kalanos Robotics Dataset Audit
description: Run the public Kalanos grader against local recordings in your own CI runner.
author: Kalanos AI
branding:
  icon: activity
  color: blue
inputs:
  path:
    description: Local dataset file or directory already available on the runner
    required: true
  version:
    description: Exact PyPI Kalanos release (ignored when install is false)
    default: '0.9.3'
  install:
    description: Install in an isolated venv; false uses an existing CLI
    default: 'true'
  executable:
    description: Preinstalled kalanos executable path or name, when install is false
    default: kalanos
  extras:
    description: Comma-separated hf,hdf5,mcap,numeric,video,all extras
    default: ''
  fail-on:
    description: Episode statuses that fail the CLI gate
    default: blocked,review,unknown
  profile:
    description: Built-in scope name or local bundle file; empty uses CLI default
    default: ''
  map-file:
    description: Optional local mapping file
    default: ''
  tier:
    description: Optional metadata,standard,full execution tier
    default: ''
  hash-source:
    description: Ask the grader to hash local source bytes before and after analysis
    default: 'false'
  no-sidecar:
    description: Ignore dataset-side mapping file
    default: 'false'
  timeout-seconds:
    description: Maximum grader execution time, excluding installation
    default: '1800'
  job-summary:
    description: Opt in to sending status and decision counts to GitHub job summary
    default: 'false'
outputs:
  status:
    description: pass, fail (decision gate), or error (operational/configuration)
    value: ${{ steps.audit.outputs.status }}
  exit-code:
    description: CLI exit status, or 2 on wrapper failure
    value: ${{ steps.audit.outputs.exit-code }}
  report-path:
    description: Local audit JSON path if produced; no upload is performed
    value: ${{ steps.audit.outputs.report-path }}
  output-directory:
    description: Local directory with logs, result and report; may include installation venv
    value: ${{ steps.audit.outputs.output-directory }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      if: inputs.install == 'true'
      with:
        python-version: '3.12'
    - name: Grade local dataset
      id: audit
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_INSTALL: ${{ inputs.install }}
        INPUT_EXECUTABLE: ${{ inputs.executable }}
        INPUT_EXTRAS: ${{ inputs.extras }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_MAP_FILE: ${{ inputs.map-file }}
        INPUT_TIER: ${{ inputs.tier }}
        INPUT_HASH_SOURCE: ${{ inputs.hash-source }}
        INPUT_NO_SIDECAR: ${{ inputs.no-sidecar }}
        INPUT_TIMEOUT: ${{ inputs.timeout-seconds }}
        INPUT_SUMMARY: ${{ inputs.job-summary }}
      run: python3 "$ACTION_DIR/scripts/run.py"
